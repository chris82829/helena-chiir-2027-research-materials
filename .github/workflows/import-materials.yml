name: Import prepared materials
on:
  push:
    paths:
      - '.github/workflows/import-materials.yml'
      - 'HELENA-materials-upload.zip'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack prepared files
        run: |
          if [ ! -f HELENA-materials-upload.zip ]; then exit 0; fi
          echo '70ed9b4ab1a10f94036642ca029067c7a1638656c7662fb1a1c42628e8275485  HELENA-materials-upload.zip' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p = Path('HELENA-materials-upload.zip')
          with zipfile.ZipFile(p) as z:
              for name in z.namelist():
                  q = Path(name)
                  assert not q.is_absolute() and '..' not in q.parts
                  assert q.parts[0] in {'participants', 'questionnaire', 'system', 'README.txt'}
              z.extractall('.')
          assert len(list(Path('participants').glob('P*/condition/answer.txt'))) == 347
          assert len(list(Path('participants').glob('P*/*/answer.txt'))) == 8328
          Path('README.md').write_text(Path('README.txt').read_text())
          p.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add participants questionnaire system README.md README.txt HELENA-materials-upload.zip
          git commit -m 'Add individual TXT responses, questionnaire and system'
          git push
